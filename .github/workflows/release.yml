# Builds the launcher and exvs-online and publishes an update that every
# launcher picks up on its own.
#
# To release: bump `version` in launcher/main.go and merge to main. When main
# has a version with no release yet, this builds it and publishes release
# v<version>. It can also be started by hand from the Actions tab.
#
# The repo must be public so launchers can download the release without a
# login. Releases hold only the built exes and json, never game files.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Read the launcher version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'const version = "\K[^"]+' launcher/main.go)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
          if gh release view "v$v" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release v$v already exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p dist
          (cd launcher && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/exvs-launcher.exe .)
          (cd exvs-online && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/exvs-online.exe .)
          cp exvs-online/exvs-online.friend.json exvs-online/exvs-online.host.json dist/

      - name: Write latest.json
        if: steps.ver.outputs.skip != 'true'
        run: |
          base="https://github.com/$RELEASES_REPO/releases/download/$TAG"
          python3 - "$base" <<'PY'
          import hashlib, json, os, subprocess, sys
          base = sys.argv[1]
          where = {
              "exvs-launcher.exe": "exvs-launcher/exvs-launcher.exe",
              "exvs-online.exe": "exvs-online/exvs-online.exe",
              "exvs-online.friend.json": "exvs-online/exvs-online.friend.json",
              "exvs-online.host.json": "exvs-online/exvs-online.host.json",
          }
          files = []
          for name, path in where.items():
              b = open("dist/" + name, "rb").read()
              files.append({"path": path, "url": base + "/" + name,
                            "sha256": hashlib.sha256(b).hexdigest(), "size": len(b)})
          notes = subprocess.run(["git", "log", "-1", "--no-merges", "--format=%s", "--", "launcher/main.go"],
                                 capture_output=True, text=True).stdout.strip()
          json.dump({"version": os.environ["VERSION"], "notes": notes, "files": files},
                    open("dist/latest.json", "w"), indent=1)
          PY
          cat dist/latest.json

      - name: Publish
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" -R "$RELEASES_REPO" \
            --title "Boost Link $VERSION" --notes "Boost Link $VERSION. The launcher updates itself; you don't need to download anything here."
